name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json — single source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck packages
        run: |
          for p in core ommu x402-gateway; do
            echo "--- $p ---"
            (cd "packages/$p" && ../../node_modules/.bin/tsc -p tsconfig.json --noEmit)
          done
      - name: Test
        run: pnpm test

  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify every citation URL resolves
        run: node scripts/check-citations.mjs
